name: E2E

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run E2E (Mocked)
        env:
          E2E_BASE_URL: http://localhost:3000
          # USE_REAL_API: '1'  # gerçek API ile koşturmak istersen aç
        run: |
          npx playwright test
        timeout-minutes: 15
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7








